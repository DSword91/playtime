# Sets default memory used for gradle commands
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Proxy settings (127.0.0.1:7897)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# Minecraft & NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.65
neo_version_range=[21.1.65,)
loader_version_range=[4,)

# Mod properties
mod_id=playtime
mod_name=PlayTime
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.dsword91.playtime
mod_authors=DSword91
mod_description=A NeoForge 1.21.1 mod that tracks player active time (excluding AFK)
